bundle:
  name: anilist_trends

variables:
  catalog:
    description: Unity Catalog catalog for every table and volume
    default: anilist
  prefix:
    description: Schema name prefix, so dev and prod never share tables
  schedule_status:
    description: PAUSED or UNPAUSED. Only prod collects on a schedule; dev runs on demand.
    default: PAUSED

targets:
  dev:
    default: true
    workspace:
      profile: anilist
    variables:
      prefix: dev_
  prod:
    workspace:
      profile: anilist
    variables:
      prefix: ""
      schedule_status: UNPAUSED

resources:
  schemas:
    landing:
      catalog_name: ${var.catalog}
      name: ${var.prefix}landing
      comment: Raw API files exactly as received. Never edited.
    bronze:
      catalog_name: ${var.catalog}
      name: ${var.prefix}bronze
      comment: Raw JSON as tables, append-only.
    silver:
      catalog_name: ${var.catalog}
      name: ${var.prefix}silver
      comment: Typed, deduplicated, one row per title per day.
    gold:
      catalog_name: ${var.catalog}
      name: ${var.prefix}gold
      comment: Kimball star schema and page report tables.

  jobs:
    daily:
      name: ${var.prefix}anilist_daily
      # Logical date of the run. Default = the day the run was triggered (UTC).
      # Override it only to re-run TODAY after a failure; see the warning below.
      parameters:
        - name: snapshot_date
          default: "{{job.trigger.time.iso_date}}"
      # 00:40 UTC = 06:10 IST. Runs 10 min after v1 (00:30 UTC), so the two
      # pipelines never hit AniList's rate limit at the same moment.
      schedule:
        quartz_cron_expression: "0 40 0 * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_status}

      tasks:
        - task_key: fetch
          spark_python_task:
            python_file: src/fetch.py
            # Arrive in sys.argv exactly as on your laptop, which is why main(argv=None) matters.
            parameters:
              - --snapshot-date
              - "{{job.parameters.snapshot_date}}"
              - --landing-dir
              - /Volumes/${var.catalog}/${var.prefix}landing/raw
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "3"   # serverless image with Python 3.12, matching your pin
            dependencies:
              - requests

  volumes:
    raw:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.landing.name}
      name: raw
      volume_type: MANAGED
      comment: Landing zone. One JSON file per country per run.
