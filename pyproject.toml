[project]
name = "anilist-trends"
version = "0.1.0"
description = "Daily trending manga from AniList: a medallion pipeline on Databricks"
readme = "README.md"
authors = [
    { name = "vrayet", email = "vedant.devhare@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.34.2",
]


[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]   # lets tests do `import fetch` without making src a package
testpaths = ["tests"]  # only collect from tests/, never from page/ or elsewhere