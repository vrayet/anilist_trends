version: 2

models:
  - name: fct_title_daily
    data_tests:
      - unique:
          column_name: "(title_id || '-' || snapshot_date)"
    columns:
      - name: title_id
        data_tests: [not_null]
      - name: snapshot_date
        data_tests: [not_null]

  - name: dim_title
    columns:
      - name: title_id
        data_tests: [unique, not_null]